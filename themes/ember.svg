<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Ember: a slow-drifting sun in an orange haze, with twinkling stars. Drawn behind the conversation by the Claude
       apps (through Cinnamon's mod) and by Cinnamon; the theme's glass lays one veil over it so text stays readable. -->
  <style>
    @keyframes drift { 0% { transform: translate(-96px, -40px) scale(1); } 50% { transform: translate(80px, 30px) scale(1.12); } 100% { transform: translate(-32px, 60px) scale(0.96); } }
    @keyframes hue { 0%, 100% { filter: url(#soft) hue-rotate(0deg) saturate(1.1); } 50% { filter: url(#soft) hue-rotate(-14deg) saturate(1.4); } }
    @keyframes twinkle { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.9; } }
    @keyframes stars { from { transform: translate(0, 0); } to { transform: translate(-400px, 200px); } }
    .haze { transform-box: view-box; transform-origin: 68% 30%; animation: drift 46s ease-in-out infinite alternate, hue 18s ease-in-out infinite; }
    .twinkle { animation: twinkle 5s ease-in-out infinite; }
    .field { animation: stars 120s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .haze, .twinkle, .field { animation: none; } }
  </style>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.36" y2="1">
      <stop offset="0" stop-color="#2a0c00"/>
      <stop offset="0.55" stop-color="#170700"/>
      <stop offset="1" stop-color="#3a1200"/>
    </linearGradient>
    <radialGradient id="sun" cx="1088" cy="300" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb15c"/>
      <stop offset="0.09" stop-color="#ff7a1a"/>
      <stop offset="0.18" stop-color="#ff5e00" stop-opacity="0.67"/>
      <stop offset="0.34" stop-color="#ff5e00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ember" cx="320" cy="800" r="760" gradientUnits="userSpaceOnUse" gradientTransform="translate(320 800) scale(1 0.62) translate(-320 -800)">
      <stop offset="0" stop-color="#ff4d00" stop-opacity="0.4"/>
      <stop offset="0.45" stop-color="#ff4d00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="1360" cy="850" r="560" gradientUnits="userSpaceOnUse" gradientTransform="translate(1360 850) scale(1 0.62) translate(-1360 -850)">
      <stop offset="0" stop-color="#ffa030" stop-opacity="0.33"/>
      <stop offset="0.4" stop-color="#ffa030" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="30"/></filter>
    <pattern id="stars-a" width="210" height="190" patternUnits="userSpaceOnUse"><circle cx="20" cy="30" r="1.5" fill="#fff2e6"/></pattern>
    <pattern id="stars-b" width="170" height="230" patternUnits="userSpaceOnUse"><circle cx="140" cy="90" r="1" fill="#ffd2a8"/></pattern>
    <pattern id="stars-c" width="260" height="210" patternUnits="userSpaceOnUse"><circle cx="75" cy="160" r="1.2" fill="#ffffff"/></pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#base)"/>
  <g class="haze">
    <rect x="-400" y="-250" width="2400" height="1500" fill="url(#ember)"/>
    <rect x="-400" y="-250" width="2400" height="1500" fill="url(#glow)"/>
    <g fill="none" stroke="#ff8a3d" stroke-opacity="0.08" stroke-width="2">
      <circle cx="1088" cy="300" r="96"/><circle cx="1088" cy="300" r="192"/><circle cx="1088" cy="300" r="288"/>
      <circle cx="1088" cy="300" r="384"/><circle cx="1088" cy="300" r="480"/><circle cx="1088" cy="300" r="576"/>
    </g>
    <rect x="-400" y="-250" width="2400" height="1500" fill="url(#sun)"/>
  </g>
  <g class="twinkle">
    <g class="field">
      <rect x="-400" y="-400" width="2400" height="1800" fill="url(#stars-a)"/>
      <rect x="-400" y="-400" width="2400" height="1800" fill="url(#stars-b)"/>
      <rect x="-400" y="-400" width="2400" height="1800" fill="url(#stars-c)"/>
    </g>
  </g>
</svg>
